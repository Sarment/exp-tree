name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run unit tests
        run: CGO_ENABLED=0 go test -race -count=1 ./...
      - name: Build CLI binary
        run: CGO_ENABLED=0 go build -o bin/exptree ./cmd/exptree

  sidecar-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check Sidecar JS files
        run: |
          node --check adapters/antigravity/sidecars/exp_board/main.mjs
          node --check adapters/antigravity/sidecars/exp_board/app.js
