# DeepSeek Harness (dsh) Overlay Patch
# Usage (from the exptree repository root, after installing `exptree` to PATH):
#   dsh web --patch adapters/dsh/exptree.yml
#   dsh headless --patch adapters/dsh/exptree.yml "Optimize benchmark throughput"

- id: mcp-manager
  name: '@deepseek-ai/dsh-mcp-manager'
  config:
    servers:
      exptree:
        transport: stdio
        command: exptree
        args:
          - mcp
        enabled: true

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  disabled: false
  config:
    customSkillDirs:
      - ./skills

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
  disabled: false
